schema_version = 1
platform = "linux/amd64"
runtime = "podman"

[compatibility]
mode = "whitelist"

[targets.debian13]
display_name = "Debian 13"
source = "docker.io/library/debian:13-slim"
expected_id = "debian"
expected_version_id = "13"
package_manager = "apt-get"
package_database = "dpkg"
family = "debian"
libc = "glibc"
layout = "fhs"
package_driver = "apt"
package_format = "deb"
runtime_backend = "podman-rootless"
update_policy = "versioned-release"
documentation = "https://hub.docker.com/_/debian"

[targets.fedora44]
display_name = "Fedora 44"
source = "registry.fedoraproject.org/fedora:44"
expected_id = "fedora"
expected_version_id = "44"
package_manager = "dnf"
package_database = "rpm"
family = "fedora"
libc = "glibc"
layout = "fhs"
package_driver = "dnf"
package_format = "rpm"
runtime_backend = "podman-rootless"
update_policy = "versioned-release"
documentation = "https://fedoraproject.org/"

[targets.arch]
display_name = "Arch Linux rolling"
source = "docker.io/library/archlinux:latest"
expected_id = "arch"
package_manager = "pacman"
package_database = "pacman"
family = "arch"
libc = "glibc"
layout = "fhs"
package_driver = "pacman"
package_format = "arch"
runtime_backend = "podman-rootless"
update_policy = "full-system-upgrade"
documentation = "https://hub.docker.com/_/archlinux"
